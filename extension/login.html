<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChronoTrack | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080e1b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .background {
            position: fixed;
            width: 400px;
            height: 400px;
            background: #2563eb;
            filter: blur(180px);
            opacity: 0.2;
            top: -100px;
            right: -100px;
            z-index: -1;
        }

        .login-container {
            width: 390px;
            padding: 40px 35px;
            background: #111c30;
            border: 1px solid #263750;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: auto;
            background: linear-gradient(135deg, #2563eb, #9333ea);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        h1 span {
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
            margin-top: 12px;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background: #263750;
            margin-bottom: 25px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        #status {
            font-size: 12px;
            margin-top: 18px;
            color: #38bdf8;
            min-height: 18px;
            line-height: 1.5;
        }

        .features {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #263750;
        }

        .feature {
            font-size: 11px;
            color: #94a3b8;
        }

        .feature span {
            display: block;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 28px;
            font-size: 10px;
            color: #64748b;
        }

        @media(max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 30px 22px;
            }
        }
    </style>

</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <div class="logo">
            ⏱
        </div>

        <h1>Chrono<span>Track</span></h1>

        <p class="subtitle">
            Take control of your digital life.
            Monitor and organize your browsing activity
            with ChronoTrack.
        </p>

        <div class="divider"></div>

        <button class="login-btn" id="googleLogin">

            <svg class="google-icon"
                 viewBox="0 0 48 48">

                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.58 5.88c4.42-4.08 7.19-10.08 7.19-17.53z"/>

                <path fill="#FBBC05"
                    d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.54 2.56 10.78l7.97-6.19z"/>

                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.9-5.78l-7.58-5.88c-2.1 1.42-4.79 2.26-8.32 2.26-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

            </svg>

            Continue with Google

        </button>

        <p id="status"></p>

        <div class="features">

            <div class="feature">
                <span>🔒</span>
                Secure Login
            </div>

            <div class="feature">
                <span>📊</span>
                Smart Analytics
            </div>

            <div class="feature">
                <span>🌐</span>
                Web Tracking
            </div>

        </div>

        <div class="footer">
            © 2026 ChronoTrack. All rights reserved.
        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
